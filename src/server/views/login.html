<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PlaylistPorter — Sign in</title>
  <style>
    :root { color-scheme: dark; }
    body { background: #121212; color: #fff; font: 15px/1.5 -apple-system, system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; margin: 0; }
    .card { text-align: center; padding: 40px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { color: #b3b3b3; margin: 0 0 32px; max-width: 420px; }
    a.btn { display: inline-block; background: #1db954; color: #000; padding: 14px 36px; border-radius: 24px; font-size: 16px; font-weight: 700; text-decoration: none; }
    a.btn:hover { background: #1ed760; }
    .small { font-size: 13px; margin-top: 24px; }
    .small a { color: #b3b3b3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ready to import</h1>
    <p>Authorize PlaylistPorter to access your Spotify library, playlists, and saved tracks. You can revoke this any time at <a href="https://www.spotify.com/account/apps/" target="_blank" rel="noopener" style="color:#1db954">spotify.com/account/apps</a>.</p>
    <a class="btn" href="/auth/start">Sign in with Spotify</a>
    <div class="small"><a href="/setup">Need to update your developer app credentials?</a></div>
  </div>
</body>
</html>
